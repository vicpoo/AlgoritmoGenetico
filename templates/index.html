<!--index.html-->
<!DOCTYPE html>
<html>
<head>
    <title>AstroOpti Web</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #0a0f1e; color: #e0e0e0; }
        .container { max-width: 900px; margin: auto; background: #1a2332; padding: 25px; border-radius: 10px; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #2a3a4a; color: white; border: 1px solid #4a6a8a; border-radius: 5px; }
        button { background: #3a6a9a; font-weight: bold; cursor: pointer; }
        button:hover { background: #4a8aba; }
        .resultado { background: #0d1520; padding: 15px; margin-top: 20px; border-radius: 8px; border-left: 4px solid #4a8aba; }
        .spinner { display: none; text-align: center; padding: 20px; }
        .error { color: #ff6b6b; padding: 15px; background: #1a0d0d; border-radius: 8px; border-left: 4px solid #f44336; margin-top: 15px; }

        .excelente { border-left-color: #4caf50; }
        .buena     { border-left-color: #2196f3; }
        .aceptable { border-left-color: #ff9800; }
        .mala      { border-left-color: #f44336; }

        .form-group { margin-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        small { color: #8aa; font-size: 0.8em; display: block; }
        hr { border-color: #2a3a4a; margin: 15px 0; }
        .resultados-grid { display: flex; flex-direction: column; gap: 15px; }

        .datos-objeto { background: #111e2e; padding: 10px 14px; border-radius: 6px; margin-top: 8px; font-size: 0.92em; }
        .datos-objeto p { margin: 4px 0; }
        .badge-lunar { display: inline-block; background: #1e2c3e; border: 1px solid #3a5a7a; padding: 3px 10px; border-radius: 12px; font-size: 0.85em; margin-left: 6px; }
        .badge-objeto { display: inline-block; background: #1e3a2e; border: 1px solid #2a6a4a; padding: 3px 10px; border-radius: 12px; font-size: 0.85em; margin-left: 6px; }

        .tabla-variables { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tabla-variables td, .tabla-variables th { padding: 8px; text-align: left; border-bottom: 1px solid #2a3a4a; }
        .tabla-variables th { color: #4a8aba; }
        .mejores-title { font-size: 1.4em; margin-top: 20px; margin-bottom: 10px; color: #4a8aba; }
        .aviso { color: #ffaa66; font-size: 0.9em; margin-top: 6px; }
        .seccion-titulo { color: #7ab8e0; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
        .hora-loc { color: #7ab8e0; }
        .hora-utc { color: #8aa; font-size: 0.85em; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 AstroOpti</h1>
    <p>Optimizador de observación astronómica</p>

    <form id="form-optimizar">
        <h3>📍 Ubicación</h3>
        <div class="form-group">
            <label>Latitud:</label>
            <input type="number" step="any" name="latitud" value="16.7821" required>
        </div>
        <div class="form-group">
            <label>Longitud:</label>
            <input type="number" step="any" name="longitud" value="-93.0900" required>
        </div>
        <div class="form-group">
            <label>Offset UTC:</label>
            <input type="number" name="offset_utc" value="-6">
            <small>México Centro: -6 | México Pacífico: -7 | CDMX: -6</small>
        </div>

        <h3>📅 Fecha</h3>
        <div class="form-group">
            <label>Fecha (UTC):</label>
            <input type="date" name="fecha" value="2026-06-22" required>
        </div>

        <h3>🔭 Equipo</h3>
        <div class="form-group">
            <label>Objeto a observar:</label>
            <select name="objeto">
                {% for obj in objetos %}
                <option value="{{ obj }}">{{ obj.capitalize() }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tipo de telescopio:</label>
            <select name="tipo_telescopio">
                <option value="reflector">Reflector</option>
                <option value="refractor">Refractor</option>
                <option value="catadioptrico">Catadióptrico</option>
            </select>
        </div>
        <div class="form-group">
            <label>Apertura (mm):</label>
            <input type="number" name="apertura_mm" value="200">
        </div>
        <div class="form-group">
            <label>Aumentos disponibles (separados por coma):</label>
            <input type="text" name="aumentos" value="50,100,150,200,250,300">
        </div>

        <h3>🌙 Condiciones del cielo</h3>
        <div class="form-group">
            <label>Fase lunar (condición del cielo nocturno):</label>
            <select name="fase_lunar">
                <option value="nueva">🌑 Luna nueva — Excelente para planetas</option>
                <option value="creciente_inicial">🌒 Creciente inicial — Muy bueno</option>
                <option value="cuarto_creciente">🌓 Cuarto creciente — Aceptable</option>
                <option value="gibosa_creciente">🌔 Gibosa creciente — Malo</option>
                <option value="llena">🌕 Luna llena — Muy malo para planetas</option>
                <option value="gibosa_menguante">🌖 Gibosa menguante — Malo</option>
                <option value="cuarto_menguante">🌗 Cuarto menguante — Aceptable</option>
                <option value="menguante_inicial">🌘 Menguante inicial — Muy bueno</option>
            </select>
        </div>
        <div class="form-group">
            <label>Estado del cielo:</label>
            <select name="estado_cielo">
                <option value="despejado">Despejado</option>
                <option value="parcialmente_nublado">Parcialmente nublado</option>
                <option value="nublado">Nublado</option>
            </select>
        </div>
        <div class="form-group">
            <label>Seeing (turbulencia atmosférica):</label>
            <select name="seeing">
                <option value="bueno">Bueno — Estrellas fijas y estables</option>
                <option value="regular">Regular — Algo de turbulencia</option>
                <option value="malo">Malo — Imagen inestable</option>
            </select>
        </div>

        <button type="submit">✨ Optimizar observación</button>
    </form>

    <div class="spinner" id="spinner">⏳ Procesando... (puede tardar hasta 1 minuto)</div>
    <div id="resultados"></div>
</div>

<script>
    document.getElementById('form-optimizar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());

        document.getElementById('spinner').style.display = 'block';
        document.getElementById('resultados').innerHTML = '';

        try {
            const resp   = await fetch('/optimizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            document.getElementById('spinner').style.display = 'none';

            if (result.error) {
                document.getElementById('resultados').innerHTML =
                    `<div class="error">❌ Error: ${result.error}</div>`;
                return;
            }

            // ── Renderizar escenarios ──────────────────────────────────
            let html = `<h2 class="mejores-title">🏆 Mejor Escenario</h2>
                        <div class="resultados-grid">`;

            // Mostrar solo el primer resultado (el mejor)
            const r = result.resultados[0];
            if (r) {
                const cls = { EXCELENTE:'excelente', BUENA:'buena',
                              ACEPTABLE:'aceptable', MALA:'mala' }[r.categoria] || 'mala';
                const sign = r.offset_utc >= 0 ? '+' : '';

                // Formatear fechas
                const inicio = r.inicio.replace('T',' ');
                const fin = r.fin.replace('T',' ');

                html += `<div class="resultado ${cls}">
                    <h3>#${r.numero} — ${r.calidad_pct}% (${r.categoria})</h3>
                    <p><strong>Ventana (UTC${sign}${r.offset_utc}):</strong>
                       ${inicio} → ${fin}
                       (${r.duracion_min} min)</p>
                    <p><strong>Aumento recomendado:</strong> ${r.aumento}x</p>`;

                html += `<p><strong>Condición lunar del cielo:</strong>
                    <span class="badge-lunar">${r.fase_lunar_cielo || '—'}</span></p>`;

                if (r.optimo) {
                    const o = r.optimo;
                    const horaLoc = o.hora_loc.replace('T',' ');
                    const horaUtc = o.hora_utc.replace('T',' ');
                    
                    html += `<div class="datos-objeto">
                        <p class="seccion-titulo">Momento óptimo</p>
                        <p><strong>Hora LOC:</strong> <span class="hora-loc">${horaLoc}</span></p>
                        <p><strong>Hora UTC:</strong> <span class="hora-utc">${horaUtc}</span></p>
                        <p><strong>Posición:</strong> Alt: ${o.altitud}° | Az: ${o.azimut}°</p>
                        <p><strong>Magnitud:</strong> ${o.magnitud}</p>`;

                    const esLuna = r.objeto === 'luna';
                    const labelFase = esLuna ? 'Fase lunar (disco)' : 'Disco iluminado del objeto';
                    html += `<p><strong>${labelFase}:</strong>
                        <span class="badge-objeto">${o.fase_objeto_pct}%</span></p>`;

                    html += `<p><strong>Diámetro angular:</strong> ${o.diametro}"</p>`;

                    if (o.distancia_tierra_au && o.distancia_tierra_au > 0) {
                        html += `<p><strong>Distancia a la Tierra:</strong> ${o.distancia_tierra_au} AU</p>`;
                    }
                    if (o.distancia_sol_au && o.distancia_sol_au > 0) {
                        html += `<p><strong>Distancia al Sol:</strong> ${o.distancia_sol_au} AU</p>`;
                    }

                    html += `</div>`;
                }

                if (r.calidad_pct < 30) {
                    html += `<p class="aviso">⚠️ Calidad baja. Considera otra fecha,
                        mejor seeing o fase lunar más oscura.</p>`;
                }

                html += `</div>`;
            }

            html += '</div>';
            document.getElementById('resultados').innerHTML = html;

        } catch (err) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('resultados').innerHTML =
                `<div class="error">❌ Error de conexión: ${err.message}</div>`;
        }
    });
</script>
</body>
</html>
